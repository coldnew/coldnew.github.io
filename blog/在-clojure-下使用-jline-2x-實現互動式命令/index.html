;fumadocs&quot;]]]}" renderer-url=/_astro/client.CMEs9KKI.js ssr uid=2onPt7><template data-astro-template><h1 class="font-light mb-2 text-4xl" data-pagefind-meta=title>在 clojure 下使用 JLine 2.x 實現互動式命令</h1><div class="text-fd-muted-foreground mb-4 text-sm"><time datetime=2015-09-30T17:37:00.000Z>Oct 1, 2015</time></div><div class="flex flex-wrap gap-2 mb-8"><a href=/tags/clojure/ class="transition-colors bg-fd-secondary font-medium hover:bg-fd-accent inline-flex items-center px-2.5 py-0.5 rounded-full text-fd-secondary-foreground text-xs">#clojure </a><a href=/tags/java/ class="transition-colors bg-fd-secondary font-medium hover:bg-fd-accent inline-flex items-center px-2.5 py-0.5 rounded-full text-fd-secondary-foreground text-xs">#java</a></div><div class="max-w-none prose" data-pagefind-body><p><a href=http://tiswww.case.edu/php/chet/readline/rltop.html>GNU Readline Library</a> 在 Linux 下是一個很常用的函式庫，在許多需要互動的指令程式上 很常見到其蹤影，最經典的莫過於 shell 了。我們在 shell 輸入資訊、使用上下鍵切換歷 史紀錄、按 <code>TAB</code> 進行自動補全等功能，實際上都是使用到了 <a href=http://tiswww.case.edu/php/chet/readline/rltop.html>readline</a> 函式庫，</p><p>在 Clojure 中，若我們想要製作類似 GNU Readline 那樣的功能，我們可以透過 JNA/JNI 等方式來讀取 readline 函式庫，或者是找其他實現。</p><p>在本篇文章中，我選用了 <a href=https://github.com/jline/jline2/ >JLine 2.x</a> 來作為 readline 函式庫的替代。<a href=https://github.com/jline/jline2/ >JLine 2.x</a> 是一個 開源並使用 <a href=http://www.opensource.org/licenses/BSD-3-Clause>Modified BSD License</a> 授權的純 Java 實現的函式庫，他提供了許多與 GNU Readline 類似的功能，是用來實現互動式命令很方便的工具。</p><h1 id=建立我們的專案>建立我們的專案</h1><p>本篇文章還是依照以往的規則，使用預設的 <em>lein</em> 樣板，因此我們這樣建立名為 <em>myapp</em> 的專案:</p><div class="group relative"><pre class="github-dark github-light shiki shiki-themes" icon="&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;path d=&quot;M 6,1 C 4.354992,1 3,2.354992 3,4 v 16 c 0,1.645008 1.354992,3 3,3 h 12 c 1.645008,0 3,-1.354992 3,-3 V 8 7 A 1.0001,1.0001 0 0 0 20.707031,6.2929687 l -5,-5 A 1.0001,1.0001 0 0 0 15,1 h -1 z m 0,2 h 7 v 3 c 0,1.645008 1.354992,3 3,3 h 3 v 11 c 0,0.564129 -0.435871,1 -1,1 H 6 C 5.4358712,21 5,20.564129 5,20 V 4 C 5,3.4358712 5.4358712,3 6,3 Z M 15,3.4140625 18.585937,7 H 16 C 15.435871,7 15,6.5641288 15,6 Z&quot; fill=&quot;currentColor&quot; /&gt;&lt;/svg&gt;" style=--shiki-light:#24292e;--shiki-dark:#e1e4e8;--shiki-light-bg:#fff;--shiki-dark-bg:#24292e tabindex=0><code><span class=line><span>coldnew@gentoo ~ $ lein new jline2</span></span></code></pre><button aria-label="Copy Text" class="transition-colors absolute backdrop-blur-lg bg-fd-background/80 hover:text-fd-accent-foreground p-1.5 right-2 rounded-lg text-fd-muted-foreground top-3 z-10" type=button><svg aria-hidden=true class="lucide lucide-clipboard" fill=none height=16 stroke=currentColor stroke-linecap=round stroke-linejoin=round stroke-width=2 viewBox="0 0 24 24" width=16 xmlns=http://www.w3.org/2000/svg><rect height=4 rx=1 ry=1 width=8 x=8 y=2></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path></svg></button></div><p>專案建立完成後，我們要稍微修改一下 <em>project.clj</em> ，在 <code>:dependencies</code> 欄位加上 <a href=https://github.com/jline/jline2/ >jline2</a> 的依賴。</p><p>(你可以在 <a href=http://mvnrepository.com/artifact/jline/jline/2.13>這裡</a> 找到最新的 JLine 版本資訊)</p><div class="group relative"><pre class="github-dark github-light shiki shiki-themes" icon="&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;path d=&quot;M 6,1 C 4.354992,1 3,2.354992 3,4 v 16 c 0,1.645008 1.354992,3 3,3 h 12 c 1.645008,0 3,-1.354992 3,-3 V 8 7 A 1.0001,1.0001 0 0 0 20.707031,6.2929687 l -5,-5 A 1.0001,1.0001 0 0 0 15,1 h -1 z m 0,2 h 7 v 3 c 0,1.645008 1.354992,3 3,3 h 3 v 11 c 0,0.564129 -0.435871,1 -1,1 H 6 C 5.4358712,21 5,20.564129 5,20 V 4 C 5,3.4358712 5.4358712,3 6,3 Z M 15,3.4140625 18.585937,7 H 16 C 15.435871,7 15,6.5641288 15,6 Z&quot; fill=&quot;currentColor&quot; /&gt;&lt;/svg&gt;" style=--shiki-light:#24292e;--shiki-dark:#e1e4e8;--shiki-light-bg:#fff;--shiki-dark-bg:#24292e tabindex=0><code><span class=line><span style=--shiki-light:#24292E;--shiki-dark:#E1E4E8>(</span><span style=--shiki-light:#D73A49;--shiki-dark:#F97583>defproject</span><span style=--shiki-light:#6F42C1;--shiki-dark:#B392F0> jline2</span><span style=--shiki-light:#032F62;--shiki-dark:#9ECBFF> &quot;0.1.0-SNAPSHOT&quot;</span></span>
