著也只是存著，剛好看到了 <a href=http://rate.bot.com.tw/Pages/Static/UIP003.zh-TW.htm>台灣銀行牌告匯率</a> 的訊息，就讓我們用 Clojure 來寫一個 parser 將這個 HTML 網頁轉換成 Clojure 常用的 <a href=https://github.com/edn-format/edn>edn</a> 格式吧。</p><p>本文將簡述如何透過 <a href=https://github.com/dakrone/clj-http>clj-http</a> 取得 <a href=http://rate.bot.com.tw/Pages/Static/UIP003.zh-TW.htm>台灣銀行牌告匯率</a> 資訊後，再使用 <a href=https://github.com/davidsantiago/hickory>hickory</a> 對取得網頁的資料進行處理，最後回傳 <a href=https://github.com/edn-format/edn>edn</a> 格式好方便我們未來的 Clojure 程式可以對這些訊息進行處理。</p><h1 id=設定我們的目標>設定我們的目標</h1><p>在開始寫程式前，先來確立我們的目標。我們希望取得 <a href=http://rate.bot.com.tw/Pages/Static/UIP003.zh-TW.htm>台灣銀行牌告匯率</a> 的資訊，並將下圖裡面的資料轉換成 Clojure 的 <a href=https://github.com/edn-format/edn>edn</a> 格式。</p><p><img alt=img src=/blog/%E4%BD%BF%E7%94%A8-Clojure-%E6%93%B7%E5%8F%96%E5%8F%B0%E7%81%A3%E9%8A%80%E8%A1%8C%E7%89%8C%E5%91%8A%E5%8C%AF%E7%8E%87/twbank.png /></p><p>因此最後我們希望可以得到這樣的結果:</p><div class="group relative"><pre class="github-dark github-light shiki shiki-themes" icon="&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;path d=&quot;M 6,1 C 4.354992,1 3,2.354992 3,4 v 16 c 0,1.645008 1.354992,3 3,3 h 12 c 1.645008,0 3,-1.354992 3,-3 V 8 7 A 1.0001,1.0001 0 0 0 20.707031,6.2929687 l -5,-5 A 1.0001,1.0001 0 0 0 15,1 h -1 z m 0,2 h 7 v 3 c 0,1.645008 1.354992,3 3,3 h 3 v 11 c 0,0.564129 -0.435871,1 -1,1 H 6 C 5.4358712,21 5,20.564129 5,20 V 4 C 5,3.4358712 5.4358712,3 6,3 Z M 15,3.4140625 18.585937,7 H 16 C 15.435871,7 15,6.5641288 15,6 Z&quot; fill=&quot;currentColor&quot; /&gt;&lt;/svg&gt;" style=--shiki-light:#24292e;--shiki-dark:#e1e4e8;--shiki-light-bg:#fff;--shiki-dark-bg:#24292e tabindex=0><code><span class=line><span style=--shiki-light:#24292E;--shiki-dark:#E1E4E8>{</span><span style=--shiki-light:#005CC5;--shiki-dark:#79B8FF>:url</span><span style=--shiki-light:#032F62;--shiki-dark:#9ECBFF> &quot;http://rate.bot.com.tw/Pages/Static/UIP003.zh-TW.htm&quot;</span><span style=--shiki-light:#24292E;--shiki-dark:#E1E4E8>,</span></span>
