sm"><time datetime=2015-09-22T17:17:00.000Z>Sep 23, 2015</time></div><div class="flex flex-wrap gap-2 mb-8"><a href=/tags/clojure/ class="transition-colors bg-fd-secondary font-medium hover:bg-fd-accent inline-flex items-center px-2.5 py-0.5 rounded-full text-fd-secondary-foreground text-xs">#clojure </a><a href=/tags/javafx/ class="transition-colors bg-fd-secondary font-medium hover:bg-fd-accent inline-flex items-center px-2.5 py-0.5 rounded-full text-fd-secondary-foreground text-xs">#javafx </a><a href=/tags/clojurescript/ class="transition-colors bg-fd-secondary font-medium hover:bg-fd-accent inline-flex items-center px-2.5 py-0.5 rounded-full text-fd-secondary-foreground text-xs">#clojurescript</a></div><div class="max-w-none prose" data-pagefind-body><link href=/blog/%E4%BD%BF%E7%94%A8-Clojure-%E5%92%8C-JavaFX-Webview-%E6%89%93%E9%80%A0%E6%A1%8C%E9%9D%A2%E7%A8%8B%E5%BC%8F/simple_javafx.png rel=preload as=image /><p>在 <a href=http://coldnew.github.io/blog/2015/building_a_desktop_application_with_cljs_and_electron.html>使用 clojurescript 和 electron 來打造桌面程式</a> 一文中我們說到了如何使用 electron 搭配 clojurescript 達到在 Node.js 平台使用 HTML 5 來打造桌面程式的方法， 這一次則是來談談如何使用 Clojure 搭配 JavaFX WebView 辦到類似的事情。</p><p>JavaFX 是目前 Java 發展的重點項目，自 Java 8 後已經整合進 JRE 裡面，在其中最吸引 我的就是 WebView 組件了，該組件實際上就是一個 WebKit 瀏覽器，既然 Java 8 已經塞 入了 Webkit 支援，也就是說我們可以用寫網頁的方式來建立我們的圖形介面，網頁的運作 流程交給 clojurescript，而大量運算則是由 clojure 來搞定。</p><p>本篇文章將談論如何在 Clojure 下用 JavaFX WebView 作為圖形介面，內容則採用 HTML 來進行顯示，為了讓文章更簡單些，這邊只講述如何使用 WebView 的部分。</p><h1 id=先來看看-java-要怎樣寫>先來看看 JAVA 要怎樣寫</h1><p>在剛開始學習 Clojure/Clojurescript 時，常常會需要參考 JAVA/Javascript 了解原本的 程式怎樣運行，接著再將其改寫、修化成更適合 lisp 開發者的函式，也因此學習 Clojure (Clojurescript) 的時候，能看懂 Java (javascript) 是最好的，也易於讓自己學習更愉快。</p><p>如果我們要用 JavaFX 寫個簡單一點的瀏覽器要怎樣作呢? 本文使用的原始程式碼如下:</p><div class="group relative"><pre class="github-dark github-light shiki shiki-themes" icon="&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;path d=&quot;M 6,1 C 4.354992,1 3,2.354992 3,4 v 16 c 0,1.645008 1.354992,3 3,3 h 12 c 1.64500
