l&quot;:[0,&quot;/blog&quot;]}]]],&quot;contentSections&quot;:[1,[[0,&quot;blog&quot;],[0,&quot;drafts&quot;],[0,&quot;frameworks&quot;],[0,&quot;fumadocs&quot;]]]}" renderer-url=/_astro/client.SUtqKblx.js ssr uid=ZXRxDz><template data-astro-template><h1 class="font-light mb-2 text-4xl" data-pagefind-meta=title>讓 Clojurescript 使用 node.js 的外部函式庫，以 tty.js 為例</h1><div class="text-fd-muted-foreground mb-4 text-sm"><time datetime=2013-06-30T03:33:00.000Z>Jun 30, 2013</time></div><div class="flex flex-wrap gap-2 mb-8"><a href=/tags/nodejs/ class="transition-colors bg-fd-secondary font-medium hover:bg-fd-accent inline-flex items-center px-2.5 py-0.5 rounded-full text-fd-secondary-foreground text-xs">#nodejs </a><a href=/tags/clojurescript/ class="transition-colors bg-fd-secondary font-medium hover:bg-fd-accent inline-flex items-center px-2.5 py-0.5 rounded-full text-fd-secondary-foreground text-xs">#clojurescript</a></div><div class="max-w-none prose" data-pagefind-body><link href=/blog/%E8%AE%93-Clojurescript-%E4%BD%BF%E7%94%A8-node.js-%E7%9A%84%E5%A4%96%E9%83%A8%E5%87%BD%E5%BC%8F%E5%BA%AB-%E4%BB%A5-tty/ttyjs.png rel=preload as=image /><p>在 <a href=http://coldnew.github.io/blog/2013/06/29_82531.html>使用 ClojureScript 來寫 node.js 程式</a> 一文當中，我們提到了可以用 ClojureScript 來寫 node.js 的程式，可是如果要引用 node.js 的外部函式，比 如說 <a href=https://github.com/chjj/tty.js>tty.js</a> 時，要怎麼辦呢？</p><p><a href=https://github.com/chjj/tty.js>tty.js</a> 是一個可以讓你在瀏覽器下使用終端機的一個很酷的 node.js 程式，雖 然他是獨立的程式，但是也可以當作函式庫引用。</p><p>本篇文章將描述如何在 ClojureScript 裏面呼叫 tty.js 的函式來建立我們的 node.js 程式。</p><h1 id=建立新的專案>建立新的專案</h1><p>我們首先先來建立一個新的開發環境，就叫他為 <code>cljs-tty</code> 好了</p><div class="group relative"><pre class="github-dark github-light shiki shiki-themes" icon="&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;path d=&quot;M 6,1 C 4.354992,1 3,2.354992 3,4 v 16 c 0,1.645008 1.354992,3 3,3 h 12 c 1.645008,0 3,-1.354992 3,-3 V 8 7 A 1.0001,1.0001 0 0 0 20.707031,6.2929687 l -5,-5 A 1.0001,1.0001 0 0 0 15,1 h -1 z m 0,2 h 7 v 3 c 0,1.645008 1.354992,3 3,3 h 3 v 11 c 0,0.564129 -0.435871,1 -1,1 H 6 C 5.4358712,21 5,20.564129 5,20 V 4 C 5,3.4358712 5.4358712,3 6,3 Z M 15,3.4140625 18.585937,7 H 16 C 15.435871,7 15,6.5641288 15,6 Z&quot; fill=&quot;currentColor&quot; /&gt;&lt;/svg&gt;" style=--shiki-light:#24292e;--shiki-dark:#e1e4e8;--shiki-light-bg:#fff;--shiki-dark-bg:#24292e tabindex=0><code><span class=line><span>lein new cljs-tty</span></span></code></pre><button aria-label="Copy Text" class="transition-colors absolute backdrop-blur-lg bg-fd-background/80 hover:text-fd-accent-foreground p-1.5 right-2 rounded-lg text-fd-muted-foreground top-3 z-10" type=button><svg aria-hidden=true class="lucide lucide-clipboard" fill=none height=16 stroke=currentColor stroke-linecap=round stroke-linejoin=round stroke-width=2 viewBox="0 0 24 24" width=16 xmlns=http://www.w3.org/2000/svg><rect height=4 rx=1 ry=1 width=8 x=8 y=2></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path></svg></button></div><h1 id=加入-cljsbuild-到你的專案>加入 cljsbuild 到你的專案</h1><p>接下來，編輯 <code>project.clj</code> 將他變成下面這樣，注意到在這篇範例中，我 們還是使用 src 作為 ClojureScript 程式的資料夾。</p><p>如果你不知道為什麼 project.clj 要這樣設定，請參考我之前寫的文章: <a href=http://coldnew.github.io/blog/2013/06/29_82531.html>使用 ClojureScript 來寫 node.js 程式</a></p><div class="group relative"><pre class="github-dark github-light shiki shiki-themes" icon="&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;path d=&quot;M 6,1 C 4.354992,1 3,2.354992 3,4 v 16 c 0,1.645008 1.354992,3 3,3 h 12 c 1.645008,0 3,-1.354992 3,-3 V 8 7 A 1.0001,1.0001 0 0 0 20.707031,6.2929687 l -5,-5 A 1.0001,1.0001 0 0 0 15,1 h -1 z m 0,2 h 7 v 3 c 0,1.645008 1.354992,3 3,3 h 3 v 11 c 0,0.564129 -0.435871,1 -1,1 H 6 C 5.4358712,21 5,20.564129 5,20 V 4 C 5,3.4358712 5.4358712,3 6,3 Z M 15,3.4140625 18.585937,7 H 16 C 15.435871,7 15,6.5641288 15,6 Z&quot; fill=&quot;currentColor&quot; /&gt;&lt;/svg&gt;" style=--shiki-light:#24292e;--shiki-dark:#e1e4e8;--shiki-light-bg:#fff;--shiki-dark-bg:#24292e tabindex=0><code><span class=line><span style=--shiki-light:#24292E;--shiki-dark:#E1E4E8>(</span><span style=--shiki-light:#D73A49;--shiki-dark:#F97583>defproject</span><span style=--shiki-light:#6F42C1;--shiki-dark:#B392F0> cljs-tty</span><span style=--shiki-light:#032F62;--shiki-dark:#9ECBFF> &quot;0.1.0-SNAPSHOT&quot;</span></span>
