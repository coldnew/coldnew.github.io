t-4xl" data-pagefind-meta=title>Android Things 學習筆記: 介紹</h1><div class="mb-4 text-fd-muted-foreground text-sm"><time datetime=2017-05-09T23:52:00.000Z>May 10, 2017</time> <span class=ml-3>分類：<a href=/categories/Android%20Things%20%E5%AD%B8%E7%BF%92%E7%AD%86%E8%A8%98%20(Raspberry%20Pi%203)/ class="hover:underline text-fd-primary"> Android Things 學習筆記 (Raspberry Pi 3)</a></span></div><div class="flex flex-wrap gap-2 mb-8"><a href=/tags/android/ class="bg-fd-secondary font-medium hover:bg-fd-accent inline-flex items-center px-2.5 py-0.5 rounded-full text-fd-secondary-foreground text-xs transition-colors">#android </a><a href=/tags/android%20things/ class="bg-fd-secondary font-medium hover:bg-fd-accent inline-flex items-center px-2.5 py-0.5 rounded-full text-fd-secondary-foreground text-xs transition-colors">#android things </a><a href=/tags/iot/ class="bg-fd-secondary font-medium hover:bg-fd-accent inline-flex items-center px-2.5 py-0.5 rounded-full text-fd-secondary-foreground text-xs transition-colors">#iot </a><a href=/tags/raspberry%20pi%203/ class="bg-fd-secondary font-medium hover:bg-fd-accent inline-flex items-center px-2.5 py-0.5 rounded-full text-fd-secondary-foreground text-xs transition-colors">#raspberry pi 3</a></div><div class="max-w-none prose" data-pagefind-body><link href=/blog/Android-Things-%E5%AD%B8%E7%BF%92%E7%AD%86%E8%A8%98-%E5%89%8D%E8%A8%80/Android-Things.jpg rel=preload as=image /><link href=/blog/Android-Things-%E5%AD%B8%E7%BF%92%E7%AD%86%E8%A8%98-%E5%89%8D%E8%A8%80/sbt.png rel=preload as=image /><p>最近打算稍微了解一下 Google 在推的 <a href=https://developer.android.com/things>Android Things</a> ，這是一套以 Android 為基礎改製而成的作業系統，目的在於用於現在很夯的物聯網(Internet of Things, IoT) 上。</p><h1 id=關於-android-things>關於 Android Things</h1><p><a href=https://developer.android.com/things/index.html>Android Things</a> 前身為 Google 的 <a href=http://chinese.engadget.com/2015/05/28/project-brillo-google-iot/ >Brillo 專案</a> ，在約 2016 年底改名為 <a href=https://developer.android.com/things/index.html>Android Things</a> 。這東西到底是什麼?</p><p>簡單的來說，隨著 Android 的普及，會使用 Java 寫 Android app 的人越來越多， <a href=https://developer.android.com/things/index.html>Android Things</a> 就是為了這些開發者存在的物連網系統，就如網頁的豪語:</p><blockquote><p>If you can build an app, you can build a device. ── Google</p><p>(只要你有能力打造出 App，你就能打造出一個裝置。)</p></blockquote><br/><p>事實上，你的確可以使用 Java 來寫 app 然後丟到支援 <a href=https://developer.android.com/things/index.html>Android Things</a> 的開發板上，來透過 GPIO、I²C、PWM 等控制周邊，這過層中底層的部分都幫你包好了，你只要會寫 Java 就可以開發物連網(IoT)裝置。</p><p><del>於是只要花個 22k 請個會寫 Java 的人，你就可以當老闆賣設備了</del> 。</p><p>當然，Google 不可能這麼佛心為了那些只會寫 Java 的人設計一個物連網系統， <a href=https://developer.android.com/things/index.html>Android Things</a> 的目的同時也是為了推廣 Android，就如 <a href=http://suyati.com/launching-android-things-googles-new-os-for-smart-iot-devices/ >Android Things - The new OS for smart IoT devices from Google</a> 這篇文章的圖片那樣:</p><p><img alt=img src=/blog/Android-Things-%E5%AD%B8%E7%BF%92%E7%AD%86%E8%A8%98-%E5%89%8D%E8%A8%80/Android-Things.jpg /></p><p>只要透過你的 Android 手機/平板，你就可以盡情的控制這些 <a href=https://developer.android.com/things/index.html>Android Things</a> 設備。</p><p>(當然這些東西你還是有辦法在 iOS 上進行控制的， <del>記得再花個 40k 請個會寫 obj-c/swift 的人</del>)</p><h1 id=支援的開發板>支援的開發板</h1><p>那如果我們想要入門 <a href=https://developer.android.com/things/index.html>Android Things</a> 的話，需要哪些開發板呢?</p><p>撰寫這篇文章的時候，官方支援的開發板有 <a href=https://developer.android.com/things/hardware/developer-kits.html>以下幾種</a> :</p><p><img alt=img src=/blog/Android-Things-%E5%AD%B8%E7%BF%92%E7%AD%86%E8%A8%98-%E5%89%8D%E8%A8%80/sbt.png /></p><p>在這些開發板中，考量到價錢以及實用性，我決定採用 <a href=https://www.raspberrypi.org/products/raspberry-pi-3-model-b/ >Raspberry Pi 3 Model B</a> 來作為我用來學習 <a href=https://developer.android.com/things/index.html>Android Things</a> 的開發板。</p><h1 id=隱憂>隱憂</h1><p>雖然 <a href=https://developer.android.com/things/index.html>Android Things</a> 是由 Google 所提出的專案，但很多 Google 提出的專案也有面臨過被廢棄的命運，比如 <a href=http://hk.on.cc/hk/bkn/cnt/finance/20160903/bkn-20160903201859069-0903_00842_001.html>Project Arc (積木手機)</a> 這個計畫也被 Google 廢棄了， <a href=https://developer.android.com/things/index.html>Android Things</a> 是否值得追隨也是個很大的問題。</p><p>此外，對於物連網裝置 (Internet of Things, IoT)，我們常用的設備都是不到 1MB 記憶體的微控制器(MCU)裝置，而 <a href=https://developer.android.com/things/index.html>Android Things</a> 最低要求要 <code>256MB 的記憶體</code> 以及動輒 <code>100MB 大小的儲存裝置</code> ，以成本來考量這其實是蠻浪費的。 (還不如去用 <a href=https://www.mbed.com/ >mbed</a> 還比較划算)</p><p>還有一個是 <code>開機時間</code> ，如果你的系統是設計讓人隨時可以關機的，那你要考慮清楚是否要對 <a href=https://developer.android.com/things/index.html>Android Things</a> 作些額外處理，在 <a href=https://coldnew.github.io/468144f4/ >Android Things 學習筆記: GPIO 的輸出控制</a> 我們實作了 Raspberry Pi 3 搭配 LED 閃爍功能，如果斷掉系統電源再重新上電的話，到 LED 開始閃爍花了 <code>1.06 分鐘</code> 。(也就是系統啟動到執行程式需要花很多時間，正式產品是一定要多作些優化的)</p><p>在 <a href=http://events.linuxfoundation.org/events/embedded-linux-conference-europe>Embedded Linux Conference 2017</a> 上的 <a href=http://events.linuxfoundation.org/sites/events/files/slides/android-things-internals-170223.pdf>Android Things - Internals and cute embedded nonsense hacks</a> 演講也有提到這些問題。</p><h1 id=延伸閱讀>延伸閱讀</h1><ul><li><a href=https://developer.android.com/things/index.html>Android Things</a></li><li><a href=https://makerdiary.co/getting-started-with-android-things/ >Android Things 來了，老司機快上車~</a></li><li><a href=http://technews.tw/2016/12/15/android-things-is-googles-new-os-for-smart-devices/ >Google 發表物聯網平台 Android Things，要讓裝置開發和做 App 一樣簡單</a></li></ul></div></template><!--astro:end--></astro-island><script src=/_astro/SimpleBlogPost.astro_astro_type_script_index_0_lang.CNj5Msle.js type=module></script></body></html>
