utPanelTop&quot;],&quot;url&quot;:[0,&quot;/blog&quot;]}]]],&quot;contentSections&quot;:[1,[[0,&quot;blog&quot;],[0,&quot;drafts&quot;],[0,&quot;frameworks&quot;],[0,&quot;fumadocs&quot;]]]}" renderer-url=/_astro/client.CMEs9KKI.js ssr uid=Z1bXMgY><template data-astro-template><h1 class="font-light mb-2 text-4xl" data-pagefind-meta=title>使用 codox 與 CircleCI 建立 Clojure 專案的文檔</h1><div class="text-fd-muted-foreground mb-4 text-sm"><time datetime=2016-02-20T13:50:00.000Z>Feb 20, 2016</time></div><div class="flex flex-wrap gap-2 mb-8"><a href=/tags/clojure/ class="transition-colors bg-fd-secondary font-medium hover:bg-fd-accent inline-flex items-center px-2.5 py-0.5 rounded-full text-fd-secondary-foreground text-xs">#clojure </a><a href=/tags/clojurescript/ class="transition-colors bg-fd-secondary font-medium hover:bg-fd-accent inline-flex items-center px-2.5 py-0.5 rounded-full text-fd-secondary-foreground text-xs">#clojurescript</a></div><div class="max-w-none prose" data-pagefind-body><link href=/blog/%E4%BD%BF%E7%94%A8-codox-%E8%88%87-CircleCI-%E5%BB%BA%E7%AB%8B-Clojure-%E5%B0%88%E6%A1%88%E7%9A%84%E6%96%87%E6%AA%94/index.png rel=preload as=image /><link href=/blog/%E4%BD%BF%E7%94%A8-codox-%E8%88%87-CircleCI-%E5%BB%BA%E7%AB%8B-Clojure-%E5%B0%88%E6%A1%88%E7%9A%84%E6%96%87%E6%AA%94/circleci1.png rel=preload as=image /><link href=/blog/%E4%BD%BF%E7%94%A8-codox-%E8%88%87-CircleCI-%E5%BB%BA%E7%AB%8B-Clojure-%E5%B0%88%E6%A1%88%E7%9A%84%E6%96%87%E6%AA%94/circleci2.png rel=preload as=image /><link href=/blog/%E4%BD%BF%E7%94%A8-codox-%E8%88%87-CircleCI-%E5%BB%BA%E7%AB%8B-Clojure-%E5%B0%88%E6%A1%88%E7%9A%84%E6%96%87%E6%AA%94/circleci3.png rel=preload as=image /><link href=/blog/%E4%BD%BF%E7%94%A8-codox-%E8%88%87-CircleCI-%E5%BB%BA%E7%AB%8B-Clojure-%E5%B0%88%E6%A1%88%E7%9A%84%E6%96%87%E6%AA%94/circleci4.png rel=preload as=image /><p>在 Clojure 世界中，常用的產生文檔工具有 <a href=https://github.com/MichaelBlume/marginalia>Marginalia</a> 以及 <a href=https://github.com/weavejester/codox>Codox</a>。 本文將講述如何透過 <a href=https://github.com/weavejester/codox>Codox</a> 以及 <a href=https://circleci.com>Circle CI</a> 來對你的函式庫進行測試以及產生文檔並發佈到 GitHub pages 去。</p><p>當然，為了便於描述，我們一樣從專案的建立開始來講 codox 的使用。</p><h1 id=建立我們的專案>建立我們的專案</h1><p>首先我們先透過 <a href=http://leiningen.org/ >leinigen</a> 產生我們 Clojure 專案的基本樣板，這邊命名該專案為 <code>example-lib</code></p><div class="group relative"><pre class="github-dark github-light shiki shiki-themes" icon="&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;path d=&quot;M 6,1 C 4.354992,1 3,2.354992 3,4 v 16 c 0,1.645008 1.354992,3 3,3 h 12 c 1.645008,0 3,-1.354992 3,-3 V 8 7 A 1.0001,1.0001 0 0 0 20.707031,6.2929687 l -5,-5 A 1.0001,1.0001 0 0 0 15,1 h -1 z m 0,2 h 7 v 3 c 0,1.645008 1.354992,3 3,3 h 3 v 11 c 0,0.564129 -0.435871,1 -1,1 H 6 C 5.4358712,21 5,20.564129 5,20 V 4 C 5,3.4358712 5.4358712,3 6,3 Z M 15,3.4140625 18.585937,7 H 16 C 15.435871,7 15,6.5641288 15,6 Z&quot; fill=&quot;currentColor&quot; /&gt;&lt;/svg&gt;" style=--shiki-light:#24292e;--shiki-dark:#e1e4e8;--shiki-light-bg:#fff;--shiki-dark-bg:#24292e tabindex=0><code><span class=line><span>coldnew@Rosia ~ $ lein new example-lib</span></span></code></pre><button aria-label="Copy Text" class="transition-colors absolute backdrop-blur-lg bg-fd-background/80 hover:text-fd-accent-foreground p-1.5 right-2 rounded-lg text-fd-muted-foreground top-3 z-10" type=button><svg aria-hidden=true class="lucide lucide-clipboard" fill=none height=16 stroke=currentColor stroke-linecap=round stroke-linejoin=round stroke-width=2 viewBox="0 0 24 24" width=16 xmlns=http://www.w3.org/2000/svg><rect height=4 rx=1 ry=1 width=8 x=8 y=2></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path></svg></button></div><p>專案建立完成後，我們要稍微修改一下 <em>project.clj</em> ，在 <code>:plugin</code> 欄位加上 lein-codox, 這會讓我們多一個 <code>lein codox</code> 命令可以用來產生文檔。</p><div class="group relative"><pre class="github-dark github-light shiki shiki-themes" icon="&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;path d=&quot;M 6,1 C 4.354992,1 3,2.354992 3,4 v 16 c 0,1.645008 1.354992,3 3,3 h 12 c 1.645008,0 3,-1.354992 3,-3 V 8 7 A 1.0001,1.0001 0 0 0 20.707031,6.2929687 l -5,-5 A 1.0001,1.0001 0 0 0 15,1 h -1 z m 0,2 h 7 v 3 c 0,1.645008 1.354992,3 3,3 h 3 v 11 c 0,0.564129 -0.435871,1 -1,1 H 6 C 5.4358712,21 5,20.564129 5,20 V 4 C 5,3.4358712 5.4358712,3 6,3 Z M 15,3.4140625 18.585937,7 H 16 C 15.435871,7 15,6.5641288 15,6 Z&quot; fill=&quot;currentColor&quot; /&gt;&lt;/svg&gt;" style=--shiki-light:#24292e;--shiki-dark:#e1e4e8;--shiki-light-bg:#fff;--shiki-dark-bg:#24292e tabindex=0><code><span class=line><span style=--shiki-light:#24292E;--shiki-dark:#E1E4E8>(</span><span style=--shiki-light:#D73A49;--shiki-dark:#F97583>defproject</span><span style=--shiki-light:#6F42C1;--shiki-dark:#B392F0> example-lib</span><span style=--shiki-light:#032F62;--shiki-dark:#9ECBFF> &quot;0.1.0-SNAPSHOT&quot;</span></span>
