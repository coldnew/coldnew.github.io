e><h1 class="font-light mb-2 text-4xl" data-pagefind-meta=title>使用 ClojureScript 來寫 node.js 程式</h1><div class="text-fd-muted-foreground mb-4 text-sm"><time datetime=2013-06-29T14:54:00.000Z>Jun 29, 2013</time></div><div class="flex flex-wrap gap-2 mb-8"><a href=/tags/clojurescript/ class="transition-colors bg-fd-secondary font-medium hover:bg-fd-accent inline-flex items-center px-2.5 py-0.5 rounded-full text-fd-secondary-foreground text-xs">#clojurescript </a><a href=/tags/nodejs/ class="transition-colors bg-fd-secondary font-medium hover:bg-fd-accent inline-flex items-center px-2.5 py-0.5 rounded-full text-fd-secondary-foreground text-xs">#nodejs</a></div><div class="max-w-none prose" data-pagefind-body><p><a href=https://github.com/clojure/clojurescript/wiki/Differences-from-Clojure>ClojureScript</a> 是相當於 Clojure 在 javascript 上的實現，由 Clojure 團隊所設 計出來的 Lisp 方言，他的語法基本上都和 Clojure 相同，也就是說，你 只要學一個 Clojure 語言，你就很可能可以辦到 Web Server 用 Clojure， Web Frontend 使用 ClojureScript 來開發的情況。</p><p>ClojureScript 的編譯器使用 Clojure 來撰寫，並使用 <a href="https://developers.google.com/closure/compiler/?hl=zh-TW">Google Closure Compiler</a> 來將編譯出來的 javascript 程式進行最佳化，對於喜歡 Lisp 又想體 驗 node.js 的開發者，這是一個非常有吸引力的語言。想了解 ClojureScript 更多，你可以參考 <a href=http://www.infoq.com/cn/news/2011/08/clojurescript>ClojureScript 通過 Javascript 將 Clojure 引入到瀏覽 器端</a> 一文。</p><p>為什麼我要使用 ClojureScript 來開發 node.js 的程式呢？用 javascript 不 好嗎？對於這樣的問題，我只能用以下兩點來回答</p><ol><li>我討厭 javascript</li><li>我討厭 javascript</li></ol><p>為什麼我討厭 javascript，我倒想問問為什麼有人會喜歡 javascript?其他 語法不說，單純就語言的結尾來看，我們假設這個程式被嵌套了非常多層，那 Lisp 和 javascript 的結尾會變成下面這樣。</p><div class="group relative"><pre class="github-dark github-light shiki shiki-themes" icon="&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;path d=&quot;M 6,1 C 4.354992,1 3,2.354992 3,4 v 16 c 0,1.645008 1.354992,3 3,3 h 12 c 1.645008,0 3,-1.354992 3,-3 V 8 7 A 1.0001,1.0001 0 0 0 20.707031,6.2929687 l -5,-5 A 1.0001,1.0001 0 0 0 15,1 h -1 z m 0,2 h 7 v 3 c 0,1.645008 1.354992,3 3,3 h 3 v 11 c 0,0.564129  stroke-linejoin=round stroke-width=2 viewBox="0 0 24 24" width=16 xmlns=http://www.w3.org/2000/svg><rect height=4 rx=1 ry=1 width=8 x=8 y=2></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path></svg></button></div><p>在 <a href=https://github.com/clojure/clojurescript/wiki/Quick-Start>Running ClojureScript on Node.js</a> 裏面說到了你必須設定一個進入點 (enter point) 讓 node.js 知道主程式在哪，因此這個設定目的就是告訴 node.js 知道說我們主要執行的函式就是 <code>-main</code> 函式。</p><h1 id=編譯你的程式碼>編譯你的程式碼</h1><p>要編譯很簡單，輸入</p><div class="group relative"><pre class="github-dark github-light shiki shiki-themes" icon="&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;path d=&quot;M 6,1 C 4.354992,1 3,2.354992 3,4 v 16 c 0,1.645008 1.354992,3 3,3 h 12 c 1.645008,0 3,-1.354992 3,-3 V 8 7 A 1.0001,1.0001 0 0 0 20.707031,6.2929687 l -5,-5 A 1.0001,1.0001 0 0 0 15,1 h -1 z m 0,2 h 7 v 3 c 0,1.645008 1.354992,3 3,3 h 3 v 11 c 0,0.564129 -0.435871,1 -1,1 H 6 C 5.4358712,21 5,20.564129 5,20 V 4 C 5,3.4358712 5.4358712,3 6,3 Z M 15,3.4140625 18.585937,7 H 16 C 15.435871,7 15,6.5641288 15,6 Z&quot; fill=&quot;currentColor&quot; /&gt;&lt;/svg&gt;" style=--shiki-light:#24292e;--shiki-dark:#e1e4e8;--shiki-light-bg:#fff;--shiki-dark-bg:#24292e tabindex=0><code><span class=line><span>lein cljsbuild once</span></span></code></pre><button aria-label="Copy Text" class="transition-colors absolute backdrop-blur-lg bg-fd-background/80 hover:text-fd-accent-foreground p-1.5 right-2 rounded-lg text-fd-muted-foreground top-3 z-10" type=button><svg aria-hidden=true class="lucide lucide-clipboard" fill=none height=16 stroke=currentColor stroke-linecap=round stroke-linejoin=round stroke-width=2 viewBox="0 0 24 24" width=16 xmlns=http://www.w3.org/2000/svg><rect height=4 rx=1 ry=1 width=8 x=8 y=2></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path></svg></button></div><p>接下來你就會看到多了 <code>target/cljsbuild-main.js</code> 這個檔案，這個就是編 譯出來的 javascript 程式。</p><h1 id=執行程式>執行程式</h1><p>因為 ClojureScript 編譯出來的檔案是 javascript 檔案，所以執行程式的方式 就和使用 node.js 一樣</p><div class="group relative"><pre class="github-dark github-light shiki shiki-themes" icon="&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;path d=&quot;M 6,1 C 4.354992,1 3,2.354992 3,4 v 16 c 0,1.645008 1.354992,3 3,3 h 12 c 1.645008,0 3,-1.354992 3,-3 V 8 7 A 1.0001,1.0001 0 0 0 20.707031,6.2929687 l -5,-5 A 1.0001,1.0001 0 0 0 15,1 h -1 z m 0,2 h 7 v 3 c 0,1.645008 1.354992,3 3,3 h 3 v 11 c 0,0.564129 -0.435871,1 -1,1 H 6 C 5.4358712,21 5,20.564129 5,20 V 4 C 5,3.4358712 5.4358712,3 6,3 Z M 15,3.4140625 18.585937,7 H 16 C 15.435871,7 15,6.5641288 15,6 Z&quot; fill=&quot;currentColor&quot; /&gt;&lt;/svg&gt;" style=--shiki-light:#24292e;--shiki-dark:#e1e4e8;--shiki-light-bg:#fff;--shiki-dark-bg:#24292e tabindex=0><code><span class=line><span>node  target/cljsbuild-main.js</span></span></code></pre><button aria-label="Copy Text" class="transition-colors absolute backdrop-blur-lg bg-fd-background/80 hover:text-fd-accent-foreground p-1.5 right-2 rounded-lg text-fd-muted-foreground top-3 z-10" type=button><svg aria-hidden=true class="lucide lucide-clipboard" fill=none height=16 stroke=currentColor stroke-linecap=round stroke-linejoin=round stroke-width=2 viewBox="0 0 24 24" width=16 xmlns=http://www.w3.org/2000/svg><rect height=4 rx=1 ry=1 width=8 x=8 y=2></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path></svg></button></div><p>接著就會看到 <strong>Hello, World!</strong> 顯示在你的終端機上了</p><h1 id=參考連結>參考連結</h1><p><code>[1]</code> <a href=https://github.com/clojure/clojurescript/ >ClojureScript GitHub</a></p><p><code>[2]</code> <a href=http://www.infoq.com/cn/news/2011/08/clojurescript>ClojureScript 通過 Javascript 將 Clojure 引入到瀏覽器端</a></p><p><code>[3]</code> <a href="https://developers.google.com/closure/compiler/?hl=zh-TW">Google Closure Compiler</a></p><p><code>[4]</code> <a href=https://github.com/emezeske/lein-cljsbuild>lein-cljsbuild GitHub</a></p></div></tem
