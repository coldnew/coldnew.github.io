 0,0.564129 -0.435871,1 -1,1 H 6 C 5.4358712,21 5,20.564129 5,20 V 4 C 5,3.4358712 5.4358712,3 6,3 Z M 15,3.4140625 18.585937,7 H 16 C 15.435871,7 15,6.5641288 15,6 Z&quot; fill=&quot;currentColor&quot; /&gt;&lt;/svg&gt;" style=--shiki-light:#24292e;--shiki-dark:#e1e4e8;--shiki-light-bg:#fff;--shiki-dark-bg:#24292e tabindex=0><code><span class=line><span style=--shiki-light:#24292E;--shiki-dark:#E1E4E8>(</span><span style=--shiki-light:#D73A49;--shiki-dark:#F97583>setq</span><span style=--shiki-light:#24292E;--shiki-dark:#E1E4E8> inhibit-linum-mode-alist</span></span>
<span class=line><span style=--shiki-light:#24292E;--shiki-dark:#E1E4E8>      &#x27;(</span></span>
<span class=line><span style=--shiki-light:#24292E;--shiki-dark:#E1E4E8>        eshell-mode</span></span>
<span class=line><span style=--shiki-light:#24292E;--shiki-dark:#E1E4E8>        shell-mode</span></span>
<span class=line><span style=--shiki-light:#24292E;--shiki-dark:#E1E4E8>        term-mode</span></span>
<span class=line><span style=--shiki-light:#24292E;--shiki-dark:#E1E4E8>        ))</span></span></code></pre><button aria-label="Copy Text" class="text-fd-muted-foreground absolute backdrop-blur-lg bg-fd-background/80 hover:text-fd-accent-foreground p-1.5 right-2 rounded-lg top-3 transition-colors z-10" type=button><svg aria-hidden=true class="lucide lucide-clipboard" fill=none height=16 stroke=currentColor stroke-linecap=round stroke-linejoin=round stroke-width=2 viewBox="0 0 24 24" width=16 xmlns=http://www.w3.org/2000/svg><rect height=4 rx=1 ry=1 width=8 x=8 y=2></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path></svg></button></div><p>接著，透過 elisp advice 的功能，當 emacs 呼叫 linum-mode 顯示時， 先檢查該 major-mode 是否有在 inhibit-linum-mode-alist 裡面， 如果有的話，則不啟用 linum-mode。</p><div class="group relative"><pre class="github-dark github-light shiki shiki-themes" icon="&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;path d=&quot;M 6,1 C 4.354992,1 3,2.354992 3,4 v 16 c 0,1.645008 1.354992,3 3,3 h 12 c 1.645008,0 3,-1.354992 3,-3 V 8 7 A 1.0001,1.0001 0 0 0 20.707031,6.2929687 l -5,-5 A 1.0001,1.0001 0 0 0 15,1 h -1 z m 0,2 h 7 v 3 c 0,1.645008 1.354992,3 3,3 h 3 v 11 c 0,0.564129 -0.435871,1 -1,1 H 6 C 5.4358712,21 5,20.564129 5,20 V 4 C 5,3.4358712 5.4358712,3 6,3 Z M 15,3.4140625 18.585937,7 H 16 C 15.435871,7 15,6.5641288 15,6 Z&quot; fill=&quot;currentColor&quot; /&gt;&lt;/svg&gt;" style=--shiki-light:#24292e;--shiki-dark:#e1e4e8;--shiki-light-bg:#fff;--shiki-dark-bg:#24292e tabindex=0><code><span class=line><span style=--shiki-light:#24292E;--shiki-dark:#E1E4E8>(</span><span style=--shiki-light:#D73A49;--shiki-dark:#F97583>defadvice</span><span style=--shiki-light:#6F42C1;--shiki-dark:#B392F0> linum-on</span><span style=--shiki-light:#24292E;--shiki-dark:#E1E4E8> (around inhibit-for-modes activate)</span></span>
<span class=line><span style=--shiki-light:#032F62;--shiki-dark:#9ECBFF>  &quot;Stop turing linum-mode if it is in the inhibit-linum-mode-alist.&quot;</span></span>
