%8C-travis-ci-%E4%BE%86%E6%B8%AC%E8%A9%A6-emacs-lisp-%E5%B0%88%E6%A1%88/travis.png rel=preload as=image /><p>最近剛好在 <a href=https://www.reddit.com>reddit</a> 看到了這篇: <a href=https://www.reddit.com/r/emacs/comments/d4g4di/a_new_set_of_installable_emacs_versions_for_your/ >A new set of installable Emacs versions for your CI builds</a>，於是就來順手試用一下。</p><p><a href=https://github.com/purcell/nix-emacs-ci>nix-emacs-ci</a> 是由 emacs 社群知名的開發者 <a href=https://github.com/purcell/ >purcell</a> 所建立的專案，主要目標是用來替代 <a href=https://github.com/rejeep/evm>evm</a> 以及讓開發者在 <a href=https://travis-ci.org/ >travis-ci</a> 可以方便根據不同版本的 emacs 進行測試而設計。</p><p>本文將順便說明如何透過 <a href=https://github.com/purcell/nix-emacs-ci>nix-emacs-ci</a> 來讓你的 emacs 套件可以在 <a href=https://travis-ci.org/ >travis-ci</a> 進行不同版本 Emacs 的測試。</p><h1 id=關於-nix-emacs-ci>關於 nix-emacs-ci</h1><p>就如 <a href=https://github.com/purcell/nix-emacs-ci>nix-emacs-ci</a> 這個專案名一樣，這專案是透過 <a href=https://nixos.org/nix/ >nix</a> 這個套件管理程式建立，並將預先編譯好的 Emacs Binary 上傳到 <a href=https://cachix.org/ >Cachix</a> 這個以 <a href=https://nixos.org/nix/ >nix</a> 套件為主的服務。</p><p>截至本文撰寫時間為止，<a href=https://github.com/purcell/nix-emacs-ci>nix-emacs-ci</a> 共支援 <code>emacs 24.2 ~ emcas 26.3</code> 以及 <code>emacs-snapshot</code> 這些版本，你只要像這樣將以下內容填到你的 <code>.travis.yml</code> 即可讓 <a href=https://travis-ci.org/ >travis-ci</a> 根據設定對你的 emacs 套件進行測試。</p><div class="group relative"><pre class="github-dark github-light shiki shiki-themes" icon="&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;path d=&quot;M 6,1 C 4.354992,1 3,2.354992 3,4 v 16 c 0,1.645008 1.354992,3 3,3 h 12 c 1.645008,0 3,-1.354992 3,-3 V 8 7 A 1.0001,1.0001 0 0 0 20.707031,6.2929687 l -5,-5 A 1.0001,1.0001 0 0 0 15,1 h -1 z m 0,2 h 7 v 3 c 0,1.645008 1.354992,3 3,3 h 3 v 11 c 0,0.564129 -0.435871,1 -1,1 H 6 C 5.4358712,21 5,20.564129 5,20 V 4 C 5,3.4358712 5.4358712,3 6,3 Z M 15,3.4140625 18.585937,7 H 16 C 15.435871,7 15,6.5641288 15,6 Z&quot; fill=&quot;currentColor&quot; /&gt;&lt;/svg&gt;" style=--shiki-light:#24292e;--shiki-dark:#e1e4e8;--shiki-light-bg:#fff;--shiki-dark-bg:#24292e tabindex=0><code><span class=line><span style=--shiki-light:#22863A;--shiki-dark:#85E89D>language</span><span style=--shiki-light:#24292E;--shiki-dark:#E1E4E8>: </span><span style=--shiki-light:#032F62;--shiki-dark:#9ECBFF>nix</span></span>
<span class=line></span>
<span class=line><span style=--shiki-light:#22863A;--shiki-dark:#85E89D>os</span><span style=--shiki-light:#24292E;--shiki-dark:#E1E4E8>:</span></span>
<span class=line><span style=--shiki-light:#24292E;--shiki-dark:#E1E4E8>  - </span><span style=--shiki-light:#032F62;--shiki-dark:#9ECBFF>linux</span></span>
