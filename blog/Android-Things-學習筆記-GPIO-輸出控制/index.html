E5%87%BA%E6%8E%A7%E5%88%B6/c1.png rel=preload as=image /><link href=/blog/Android-Things-%E5%AD%B8%E7%BF%92%E7%AD%86%E8%A8%98-GPIO-%E8%BC%B8%E5%87%BA%E6%8E%A7%E5%88%B6/blink.gif rel=preload as=image /><p>在 <a href=http://coldnew.github.io/8e801cc4/ >Android Things 學習筆記: Raspberry Pi 3 安裝 OS</a> 一文中我們搞定了 <a href=https://developer.android.com/things/index.html>Android Things</a> 在 Raspberry Pi 3 上的安裝，終於可以開始來寫我們的程式了。</p><p>這邊文章讓我們來小試身手，透過 GPIO 的輸出來控制外接於 Raspberry Pi 3 上的 LED 燈。</p><h1 id=使用設備>使用設備</h1><p>要完成本篇文章所描述的部份，你需要以下幾種器材</p><ul><li>Raspberry Pi 3</li><li>LED (紅)</li><li>電阻 (150 Ω, 1/4W)</li><li>麵包板</li><li>單蕊線或跳線</li></ul><h1 id=硬體線路>硬體線路</h1><p>下面的硬體線路使用 <a href=http://fritzing.org/ >Fritzing</a> 軟體來繪製，我選用 <code>GPIO21</code> 來當作提供給 LED 的電源端，由於 Raspberry Pi 3 的 GPIO 輸出為 <code>3.3V DC</code> 的電壓，稍微再加個 <code>150 Ω</code> 的電阻來保護我們的 LED 以及 Raspberry Pi 3。 (<a href=file:Android-Things-%E5%AD%B8%E7%BF%92%E7%AD%86%E8%A8%98-GPIO-%E8%BC%B8%E5%87%BA%E6%8E%A7%E5%88%B6/rpi3_schematics.fzz>下載設計檔案</a>)</p><blockquote><p><strong>注意到電阻值可能會依據你的 LED 不同而改變</strong></p></blockquote><br/><div class="gap-6 grid grid-cols-1 md:grid-cols-2 my-6 not-prose"><div><p><strong>麵包板連線</strong></p><p><img alt=img src=/blog/Android-Things-%E5%AD%B8%E7%BF%92%E7%AD%86%E8%A8%98-GPIO-%E8%BC%B8%E5%87%BA%E6%8E%A7%E5%88%B6/rpi3_schematics_bb.png /></p></div><div><p><strong>電路連接</strong></p><p><img alt=img src=/blog/Android-Things-%E5%AD%B8%E7%BF%92%E7%AD%86%E8%A8%98-GPIO-%E8%BC%B8%E5%87%BA%E6%8E%A7%E5%88%B6/rpi3_schematics.png /></p></div></div><p>Raspberry Pi 3 與 GPIO 編號的對應關係，可以參考 <a href=https://www.element14.com/community/docs/DOC-73950/l/raspberry-pi-3-model-b-gpio-40-pin-block-pinout>Element14</a> 所提供的圖表，這邊我將我用到的用紅線框出</p><p><img alt=img src=/blog/Android-Things-%E5%AD%B8%E7%BF%92%E7%AD%86%E8%A8%98-GPIO-%E8%BC%B8%E5%87%BA%E6%8E%A7%E5%88%B6/pi3_gpio.png /></p><h1 id=建立專案>建立專案</h1><p>由於這是我們的第一個專案，就不透過 <a href=https://github.com/androidthings/new-project-template>androidthings/new-project-template</a> 這個範例樣板來建立我們的專案，讓我們透過 <a href=https://developer.android.com/studio/index.html>Android Studio</a> 來一步一步開始吧。</p><p>不過建立新專案之前，記得先透過 <a href=https://developer.android.com/tools/help/adb.html>adb</a> 連上你的 Raspberry Pi 3</p><div class="group relative"><pre class="github-dark github-light shiki shiki-themes" icon="&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;path d=&quot;M 6,1 C 4.354992,1 3,2.354992 3,4 v 16 c 0,1.645008 1.354992,3 3,3 h 12 c 1.645008,0 3,-1.354992 3,-3 V 8 7 A 1.0001,1.0001 0 0 0 20.707031,6.2929687 l -5,-5 A 1.0001,1.0001 0 0 0 15,1 h -1 z m 0,2 h 7 v 3 c 0,1.645008 1.354992,3 3,3 h 3 v 11 c 0,0.564129 -0.435871,1 -1,1 H 6 C 5.4358712,21 5,20.564129 5,20 V 4 C 5,3.4358712 5.4358712,3 6,3 Z M 15,3.4140625 18.585937,7 H 16 C 15.435871,7 15,6.5641288 15,6 Z&quot; fill=&quot;currentColor&quot; /&gt;&lt;/svg&gt;" style=--shiki-light:#24292e;--shiki-dark:#e1e4e8;--shiki-light-bg:#fff;--shiki-dark-bg:#24292e tabindex=0><code><span class=line><span>coldnew@osx ~ $ adb connect Android.local</span></span></code></pre><button aria-label="Copy Text" class="transition-colors absolute backdrop-blur-lg bg-fd-background/80 hover:text-fd-accent-foreground p-1.5 right-2 rounded-lg text-fd-muted-foreground top-3 z-10" type=button><svg aria-hidden=true class="lucide lucide-clipboard" fill=none height=16 stroke=currentColor stroke-linecap=round stroke-linejoin=round stroke-width=2 viewBox="0 0 24 24" width=16 xmlns=http://www.w3.org/2000/svg><rect height=4 rx=1 ry=1 width=8 x=8 y=2></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path></svg></button></div><p>首先先打開 <a href=https://developer.android.com/studio/index.html>Android Studio</a></p><p><img alt=img src=/blog/Android-Things-%E5%AD%B8%E7%BF%92%E7%AD%86%E8%A8%98-GPIO-%E8%BC%B8%E5%87%BA%E6%8E%A7%E5%88%B6/a1.png /></p><p>接下來命名我們的專案叫做 <code>Hello Things</code></p><p><img alt=img src=/blog/Android-Things-%E5%AD%B8%E7%BF%92%E7%AD%86%E8%A8%98-GPIO-%E8%BC%B8%E5%87%BA%E6%8E%A7%E5%88%B6/a2.png /></p><p>在選擇 <code>Minimum SDK</code> 的時候，記得要選擇 <code>API 24</code> 或是以上的版本</p><p><img alt=img src=/blog/Android-Things-%E5%AD%B8%E7%BF%92%E7%AD%86%E8%A8%98-GPIO-%E8%BC%B8%E5%87%BA%E6%8E%A7%E5%88%B6/a3.png /></p><p>選擇 <code>Empty Activity</code></p><p><img alt=img src=/blog/Android-Things-%E5%AD%B8%E7%BF%92%E7%AD%86%E8%A8%98-GPIO-%E8%BC%B8%E5%87%BA%E6%8E%A7%E5%88%B6/a4.png /></p><p>好了後，按下 <code>Finish</code> 即可</p><p><img alt=img src=/blog/Android-Things-%E5%AD%B8%E7%BF%92%E7%AD%86%E8%A8%98-GPIO-%E8%BC%B8%E5%87%BA%E6%8E%A7%E5%88%B6/a5.png /></p><h1 id=修改專案>修改專案</h1><h2 id=buildgradle>build.gradle</h2><p>建立好專案後，我們首先要修改 <code>build.gradle</code> 並加入 Android Things 的依賴</p><div class="group relative"><pre class="github-dark github-light shiki shiki-themes" icon="&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;path d=&quot;M 6,1 C 4.354992,1 3,2.354992 3,4 v 16 c 0,1.645008 1.354992,3 3,3 h 12 c 1.645008,0 3,-1.354992 3,-3 V 8 7 A 1.0001,1.0001 0 0 0 20.707031,6.2929687 l -5,-5 A 1.0001,1.0001 0 0 0 15,1 h -1 z m 0,2 h 7 v 3 c 0,1.645008 1.354992,3 3,3 h 3 v 11 c 0,0.564129 -0.435871,1 -1,1 H 6 C 5.4358712,21 5,20.564129 5,20 V 4 C 5,3.4358712 5.4358712,3 6,3 Z M 15,3.4140625 18.585937,7 H 16 C 15.435871,7 15,6.5641288 15,6 Z&quot; fill=&quot;currentColor&quot; /&gt;&lt;/svg&gt;" style=--shiki-light:#24292e;--shiki-dark:#e1e4e8;--shiki-light-bg:#fff;--shiki-dark-bg:#24292e tabindex=0><code><span class=line><span style=--shiki-light:#24292E;--shiki-dark:#E1E4E8>dependencies {</span></span>
