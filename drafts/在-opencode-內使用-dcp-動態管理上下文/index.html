t;],[0,&quot;drafts&quot;],[0,&quot;frameworks&quot;],[0,&quot;fumadocs&quot;]]]}" renderer-url=/_astro/client.CMEs9KKI.js ssr uid=1Hlsqg><template data-astro-template><h1 class="font-semibold mb-2 text-3xl" data-pagefind-meta=title>在 opencode 內使用 DCP 動態管理上下文</h1><div class="text-fd-muted-foreground mb-8 text-sm"><time datetime=2026-03-07T08:00:00.000Z>Mar 7, 2026</time></div><div class="max-w-none prose" data-pagefind-body><p>使用 <a href=https://opencode.ai/ >opencode</a> 進行開發時，隨著對話長度增加，上下文會累積大量工具調用和歷史紀錄。這些內容不僅消耗 token，還會影響 AI 代理的判斷效率。<a href=https://github.com/Opencode-DCP/opencode-dynamic-context-pruning>dcp</a> (Dynamic Context Pruning) 是一個專門為 <a href=https://opencode.ai/ >opencode</a> 設計的動態上下文管理插件，可以自動修剪過時內容，保持對話上下文的精簡和高效。</p><p>這篇文章紀錄 <a href=https://github.com/Opencode-DCP/opencode-dynamic-context-pruning>dcp</a> 的核心功能、安裝步驟和實際使用技巧。</p><h1 id=dcp-是什麼>DCP 是什麼？</h1><p><a href=https://github.com/Opencode-DCP/opencode-dynamic-context-pruning>dcp</a> 是一個 <a href=https://opencode.ai/ >opencode</a> 插件，提供三種核心工具來動態管理對話上下文：</p><ol><li>**Distill**：將關鍵發現提煉為簡潔摘要後移除原始內容</li><li>**Compress**：將大段對話內容合併為單一摘要</li><li>**Prune**：移除已完成或嘈雜的工具內容</li></ol><p>與 <a href=https://github.com/anomalyco/rtk>rtk</a> 優化命令輸出不同，<a href=https://github.com/Opencode-DCP/opencode-dynamic-context-pruning>dcp</a> 專注於管理對話歷史中的工具調用和上下文內容，兩者可以同時使用以達到最佳 token 節省效果。</p><h1 id=安裝-dcp>安裝 DCP</h1><p>在專案的 `opencode.jsonc` 或全域設定中添加插件：</p><div class="group relative"><pre class="github-dark github-light shiki shiki-themes" icon="&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;path d=&quot;M 6,1 C 4.354992,1 3,2.354992 3,4 v 16 c 0,1.645008 1.354992,3 3,3 h 12 c 1.645008,0 3,-1.354992 3,-3 V 8 7 A 1.0001,1.0001 0 0 0 20.707031,6.2929687 l -5,-5 A 1.0001,1.0001 0 0 0 15,1 h -1 z m 0,2 h 7 v 3 c 0,1.645008 1.354992,3 3,3 h 3 v 11 c 0,0.564129 -0.435871,1 -1,1 H 6 C 5.4358712,21 5,20.564129 5,20 V 4 C 5,3.4358712 5.4358712,3 6,3 Z M 15,3.4140625 18.585937,7 H 16 C 15.435871,7 15,6.5641288 15,6 Z&quot; fill=&quot;currentColor&quot; /&gt;&lt;/svg&gt;" style=--shiki-light:#24292e;--shiki-dark:#e1e4e8;--shiki-light-bg:#fff;--shiki-dark-bg:#24292e tabindex=0><code><span class=line><span style=--shiki-light:#24292E;--shiki-dark:#E1E4E8>{</span></span>
<span class=line><span style=--shiki-light:#005CC5;--shiki-dark:#79B8FF>  &quot;plugin&quot;</span><span style=--shiki-light:#24292E;--shiki-dark:#E1E4E8>: [</span><span style=--shiki-light:#032F62;--shiki-dark:#9ECBFF>&quot;@tarquinen/opencode-dcp@latest&quot;</span><span style=--shiki-light:#24292E;--shiki-dark:#E1E4E8>]</span></span>
<span class=line><span style=--shiki-light:#24292E;--shiki-dark:#E1E4E8>}</span></span></code></pre><button aria-label="Copy Text" class="text-fd-muted-foreground absolute backdrop-blur-lg bg-fd-background/80 hover:text-fd-accent-foreground p-1.5 right-2 rounded-lg top-3 transition-colors z-10" type=button><svg aria-hidden=true class="lucide lucide-clipboard" fill=none height=16 stroke=currentColor stroke-linecap=round stroke-linejoin=round stroke-width=2 viewBox="0 0 24 24" width=16 xmlns=http://www.w3.org/2000/svg><rect height=4 rx=1 ry=1 width=8 x=8 y=2></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path></svg></button></div><p>安裝後重新啟動 <a href=https://opencode.ai/ >opencode</a>，<a href=https://github.com/Opencode-DCP/opencode-dynamic-context-pruning>dcp</a> 會自動啟用。</p><h1 id=配置-dcp>配置 DCP</h1><p><a href=https://github.com/Opencode-DCP/opencode-dynamic-context-pruning>dcp</a> 的配置文件位於：</p><ul><li>全域配置：`~/.config/opencode/dcp.jsonc`</li><li>專案配置：`.opencode/dcp.jsonc`</li></ul><p>預設配置通常無需修改，<a href=https://github.com/Opencode-DCP/opencode-dynamic-context-pruning>dcp</a> 會自動根據上下文長度觸發修剪。</p><h1 id=自動修剪策略>自動修剪策略</h1><p><a href=https://github.com/Opencode-DCP/opencode-dynamic-context-pruning>dcp</a> 內建多種自動修剪策略，無需 LLM 成本：</p><h2 id=去重-deduplication>去重 (Deduplication)</h2><p>移除重複的工具調用。例如連續多次執行 `git status` 時，只保留最新結果。</p><h2 id=覆蓋寫入-supersede-writes>覆蓋寫入 (Supersede Writes)</h2><p>當檔案被寫入後又讀取時，移除原始寫入內容。因為讀取內容已經包含最新狀態。</p><h2 id=清除錯誤-purge-errors>清除錯誤 (Purge Errors)</h2><p>錯誤的工具調用經過設定回合數後自動移除輸入內容，避免干擾後續判斷。</p><h1 id=手動管理上下文>手動管理上下文</h1><p><a href=https://github.com/Opencode-DCP/opencode-dynamic-context-pruning>dcp</a> 提供多個 slash commands 來手動管理上下文：</p><h2 id=查看上下文狀態>查看上下文狀態</h2><div class="group relative"><pre class="github-dark github-light shiki shiki-themes" icon="&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;path d=&quot;M 6,1 C 4.354992,1 3,2.354992 3,4 v 16 c 0,1.645008 1.354992,3 3,3 h 12 c 1.645008,0 3,-1.354992 3,-3 V 8 7 A 1.0001,1.0001 0 0 0 20.707031,6.2929687 l -5,-5 A 1.0001,1.0001 0 0 0 15,1 h -1 z m 0,2 h 7 v 3 c 0,1.645008 1.354992,3 3,3 h 3 v 11 c 0,0.564129 -0.435871,1 -1,1 H 6 C 5.4358712,21 5,20.564129 5,20 V 4 C 5,3.4358712 5.4358712,3 6,3 Z M 15,3.4140625 18.585937,7 H 16 C 15.435871,7 15,6.5641288 15,6 Z&quot; fill=&quot;currentColor&quot; /&gt;&lt;/svg&gt;" style=--shiki-light:#24292e;--shiki-dark:#e1e4e8;--shiki-light-bg:#fff;--shiki-dark-bg:#24292e tabindex=0><code><span class=line><span>/dcp context</span></span></code></pre><button aria-label="Copy Text" class="text-fd-muted-foreground absolute backdrop-blur-lg bg-fd-background/80 hover:text-fd-accent-foreground p-1.5 right-2 rounded-lg top-3 transition-colors z-10" type=button><svg aria-hidden=true class="lucide lucide-clipboard" fill=none height=16 stroke=currentColor stroke-linecap=round stroke-linejoin=round stroke-width=2 viewBox="0 0 24 24" width=16 xmlns=http://www.w3.org/2000/svg><rect height=4 rx=1 ry=1 width=8 x=8 y=2></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path></svg></button></div><p>顯示當前 session 的 token 使用分析，包括：</p><ul><li>總 token 使用量</li><li>已修剪的內容統計</li><li>當前上下文長度</li></ul><h2 id=查看修剪統計>查看修剪統計</h2><div class="group relative"><pre class="github-dark github-light shiki shiki-themes" icon="&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;path d=&quot;M 6,1 C 4.354992,1 3,2.354992 3,4 v 16 c 0,1.645008 1.354992,3 3,3 h 12 c 1.645008,0 3,-1.354992 3,-3 V 8 7 A 1.0001,1.0001 0 0 0 20.707031,6.2929687 l -5,-5 A 1.0001,1.0001 0 0 0 15,1 h -1 z m 0,2 h 7 v 3 c 0,1.645008 1.354992,3 3,3 h 3 v 11 c 0,0.564129 -0.435871,1 -1,1 H 6 C 5.4358712,21 5,20.564129 5,20 V 4 C 5,3.4358712 5.4358712,3 6,3 Z M 15,3.4140625 18.585937,7 H 16 C 15.435871,7 15,6.5641288 15,6 Z&quot; fill=&quot;currentColor&quot; /&gt;&lt;/svg&gt;" style=--shiki-light:#24292e;--shiki-dark:#e1e4e8;--shiki-light-bg:#fff;--shiki-dark-bg:#24292e tabindex=0><code><span class=line><span>/dcp stats</span></span></code></pre><button aria-label="Copy Text" class="text-fd-muted-foreground absolute backdrop-blur-lg bg-fd-background/80 hover:text-fd-accent-foreground p-1.5 right-2 rounded-lg top-3 transition-colors z-10" type=button><svg aria-hidden=true class="lucide lucide-clipboard" fill=none height=16 stroke=currentColor stroke-linecap=round stroke-linejoin=round stroke-width=2 viewBox="0 0 24 24" width=16 xmlns=http://www.w3.org/2000/svg><rect height=4 rx=1 ry=1 width=8 x=8 y=2></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path></svg></button></div><p>顯示累積修剪統計，幫助了解 <a href=https://github.com/Opencode-DCP/opencode-dynamic-context-pruning>dcp</a> 的節省效果。</p><h2 id=手動修剪>手動修剪</h2><div class="group relative"><pre class="github-dark github-light shiki shiki-themes" icon="&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;path d=&quot;M 6,1 C 4.354992,1 3,2.354992 3,4 v 16 c 0,1.645008 1.354992,3 3,3 h 12 c 1.645008,0 3,-1.354992 3,-3 V 8 7 A 1.0001,1.0001 0 0 0 20.707031,6.2929687 l -5,-5 A 1.0001,1.0001 0 0 0 15,1 h -1 z m 0,2 h 7 v 3 c 0,1.645008 1.354992,3 3,3 h 3 v 11 c 0,0.564129 -0.435871,1 -1,1 H 6 C 5.4358712,21 5,20.564129 5,20 V 4 C 5,3.4358712 5.4358712,3 6,3 Z M 15,3.4140625 18.585937,7 H 16 C 15.435871,7 15,6.5641288 15,6 Z&quot; fill=&quot;currentColor&quot; /&gt;&lt;/svg&gt;" style=--shiki-light:#24292e;--shiki-dark:#e1e4e8;--shiki-light-bg:#fff;--shiki-dark-bg:#24292e tabindex=0><code><span class=line><span>/dcp sweep [n]</span></span></code></pre><button aria-label="Copy Text" class="text-fd-muted-foreground absolute backdrop-blur-lg bg-fd-background/80 hover:text-fd-accent-foreground p-1.5 right-2 rounded-lg top-3 transition-colors z-10" type=button><svg aria-hidden=true class="lucide lucide-clipboard" fill=none height=16 stroke=currentColor stroke-linecap=round stroke-linejoin=round stroke-width=2 viewBox="0 0 24 24" width=16 xmlns=http://www.w3.org/2000/svg><rect height=4 rx=1 ry=1 width=8 x=8 y=2></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path></svg></button></div><p>修剪最後 n 個工具調用。例如 `/dcp sweep 10` 會移除最近 10 個工具輸出。</p><h2 id=切換手動模式>切換手動模式</h2><div class="group relative"><pre class="github-dark github-light shiki shiki-themes" icon="&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;path d=&quot;M 6,1 C 4.354992,1 3,2.354992 3,4 v 16 c 0,1.645008 1.354992,3 3,3 h 12 c 1.645008,0 3,-1.354992 3,-3 V 8 7 A 1.0001,1.0001 0 0 0 20.707031,6.2929687 l -5,-5 A 1.0001,1.0001 0 0 0 15,1 h -1 z m 0,2 h 7 v 3 c 0,1.645008 1.354992,3 3,3 h 3 v 11 c 0,0.564129 -0.435871,1 -1,1 H 6 C 5.4358712,21 5,20.564129 5,20 V 4 C 5,3.4358712 5.4358712,3 6,3 Z M 15,3.4140625 18.585937,7 H 16 C 15.435871,7 15,6.5641288 15,6 Z&quot; fill=&quot;currentColor&quot; /&gt;&lt;/svg&gt;" style=--shiki-light:#24292e;--shiki-dark:#e1e4e8;--shiki-light-bg:#fff;--shiki-dark-bg:#24292e tabindex=0><code><span class=line><span>/dcp manual on</span></span>
<span class=line><span>/dcp manual off</span></span></code></pre><button aria-label="Copy Text" class="text-fd-muted-foreground absolute backdrop-blur-lg bg-fd-background/80 hover:text-fd-accent-foreground p-1.5 right-2 rounded-lg top-3 transition-colors z-10" type=button><svg aria-hidden=true class="lucide lucide-clipboard" fill=none height=16 stroke=currentColor stroke-linecap=round stroke-linejoin=round stroke-width=2 viewBox="0 0 24 24" width=16 xmlns=http://www.w3.org/2000/svg><rect height=4 rx=1 ry=1 width=8 x=8 y=2></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path></svg></button></div><p>切換自動修剪的開關。手動模式下需要明確呼叫修剪命令。</p><h2 id=觸發特定工具>觸發特定工具</h2><div class="group relative"><pre class="github-dark github-light shiki shiki-themes" icon="&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;path d=&quot;M 6,1 C 4.354992,1 3,2.354992 3,4 v 16 c 0,1.645008 1.354992,3 3,3 h 12 c 1.645008,0 3,-1.354992 3,-3 V 8 7 A 1.0001,1.0001 0 0 0 20.707031,6.2929687 l -5,-5 A 1.0001,1.0001 0 0 0 15,1 h -1 z m 0,2 h 7 v 3 c 0,1.645008 1.354992,3 3,3 h 3 v 11 c 0,0.564129 -0.435871,1 -1,1 H 6 C 5.4358712,21 5,20.564129 5,20 V 4 C 5,3.4358712 5.4358712,3 6,3 Z M 15,3.4140625 18.585937,7 H 16 C 15.435871,7 15,6.5641288 15,6 Z&quot; fill=&quot;currentColor&quot; /&gt;&lt;/svg&gt;" style=--shiki-light:#24292e;--shiki-dark:#e1e4e8;--shiki-light-bg:#fff;--shiki-dark-bg:#24292e tabindex=0><code><span class=line><span>/dcp prune [focus]</span></span>
<span class=line><span>/dcp distill [focus]</span></span>
<span class=line><span>/dcp compress [focus]</span></span></code></pre><button aria-label="Copy Text" class="text-fd-muted-foreground absolute backdrop-blur-lg bg-fd-background/80 hover:text-fd-accent-foreground p-1.5 right-2 rounded-lg top-3 transition-colors z-10" type=button><svg aria-hidden=true class="lucide lucide-clipboard" fill=none height=16 stroke=currentColor stroke-linecap=round stroke-linejoin=round stroke-width=2 viewBox="0 0 24 24" width=16 xmlns=http://www.w3.org/2000/svg><rect height=4 rx=1 ry=1 width=8 x=8 y=2></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path></svg></button></div><p>手動觸發特定的修剪工具，`focus` 參數可以指定修剪焦點。</p><h1 id=dcp-與-rtk-的差異>DCP 與 RTK 的差異</h1><table><thead><tr><th>特性</th><th><a href=https://github.com/Opencode-DCP/opencode-dynamic-context-pruning>DCP</a></th><th><a href=https://github.com/anomalyco/rtk>RTK</a></th></tr></thead><tbody><tr><td>優化目標</td><td>對話上下文</td><td>命令輸出</td></tr><tr><td>作用時機</td><td>工具調用後</td><td>命令執行時</td></tr><tr><td>節省比例</td><td>30-50%</td><td>60-90%</td></tr><tr><td>配置需求</td><td>無需配置</td><td>需安裝 Homebrew</td></tr><tr><td>適用場景</td><td>長對話 session</td><td>頻繁 CLI 操作</td></tr></tbody></table><p>兩者可以同時使用：<a href=https://github.com/anomalyco/rtk>rtk</a> 優化單次命令輸出，<a href=https://github.com/Opencode-DCP/opencode-dynamic-context-pruning>dcp</a> 管理長期對話歷史。</p><h1 id=prompt-cache-影響>Prompt Cache 影響</h1><p>使用 <a href=https://github.com/Opencode-DCP/opencode-dynamic-context-pruning>dcp</a> 會影響 Prompt Cache 的命中率：</p><table><thead><tr><th>場景</th><th>快取命中率</th></tr></thead><tbody><tr><td>無 <a href=https://github.com/Opencode-DCP/opencode-dynamic-context-pruning>dcp</a></td><td>85%</td></tr><tr><td>有 <a href=https://github.com/Opencode-DCP/opencode-dynamic-context-pruning>dcp</a></td><td>80%</td></tr></tbody></table><p>雖然快取命中率略降，但 token 節省通常超過快取損失。建議在長對話中使用 <a href=https://github.com/Opencode-DCP/opencode-dynamic-context-pruning>dcp</a>，短對話可以關閉。</p><h1 id=限制與注意事項>限制與注意事項</h1><ol><li>**Subagents 不支援**：<a href=https://github.com/Opencode-DCP/opencode-dynamic-context-pruning>dcp</a> 目前不支援 subagents，因為 subagents 需要完整上下文來產生摘要</li><li>**首次修剪延遲**：首次觸發修剪時可能有輕微延遲</li><li>**配置衝突**：避免與其他上下文管理插件同時使用</li></ol><h1 id=實際使用建議>實際使用建議</h1><h2 id=推薦配置>推薦配置**</h2><div class="group relative"><pre class="github-dark github-light shiki shiki-themes" icon="&lt;svg viewBox=&quot;0 0 24 24&quot;&gt;&lt;path d=&quot;M 6,1 C 4.354992,1 3,2.354992 3,4 v 16 c 0,1.645008 1.354992,3 3,3 h 12 c 1.645008,0 3,-1.354992 3,-3 V 8 7 A 1.0001,1.0001 0 0 0 20.707031,6.2929687 l -5,-5 A 1.0001,1.0001 0 0 0 15,1 h -1 z m 0,2 h 7 v 3 c 0,1.645008 1.354992,3 3,3 h 3 v 11 c 0,0.564129 -0.435871,1 -1,1 H 6 C 5.4358712,21 5,20.564129 5,20 V 4 C 5,3.4358712 5.4358712,3 6,3 Z M 15,3.4140625 18.585937,7 H 16 C 15.435871,7 15,6.5641288 15,6 Z&quot; fill=&quot;currentColor&quot; /&gt;&lt;/svg&gt;" style=--shiki-light:#24292e;--shiki-dark:#e1e4e8;--shiki-light-bg:#fff;--shiki-dark-bg:#24292e tabindex=0><code><span class=line><span style=--shiki-light:#24292E;--shiki-dark:#E1E4E8>{</span></span>
<span class=line><span style=--shiki-light:#005CC5;--shiki-dark:#79B8FF>  &quot;plugins&quot;</span><span style=--shiki-light:#24292E;--shiki-dark:#E1E4E8>: [</span></span>
<span class=line><span style=--shiki-light:#032F62;--shiki-dark:#9ECBFF>    &quot;@tarquinen/opencode-dcp@latest&quot;</span></span>
<span class=line><span style=--shiki-light:#24292E;--shiki-dark:#E1E4E8>  ],</span></span>
<span class=line><span style=--shiki-light:#005CC5;--shiki-dark:#79B8FF>  &quot;dcp&quot;</span><span style=--shiki-light:#24292E;--shiki-dark:#E1E4E8>: {</span></span>
<span class=line><span style=--shiki-light:#005CC5;--shiki-dark:#79B8FF>    &quot;auto_prune&quot;</span><span style=--shiki-light:#24292E;--shiki-dark:#E1E4E8>: </span><span style=--shiki-light:#005CC5;--shiki-dark:#79B8FF>true</span><span style=--shiki-light:#24292E;--shiki-dark:#E1E4E8>,</span></span>
<span class=line><span style=--shiki-light:#005CC5;--shiki-dark:#79B8FF>    &quot;preserve_errors&quot;</span><span style=--shiki-light:#24292E;--shiki-dark:#E1E4E8>: </span><span style=--shiki-light:#005CC5;--shiki-dark:#79B8FF>3</span><span style=--shiki-light:#24292E;--shiki-dark:#E1E4E8>,  </span><span style=--shiki-light:#6A737D;--shiki-dark:#6A737D>// 保留最近 3 個錯誤</span></span>
